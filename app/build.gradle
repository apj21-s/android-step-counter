plugins { id 'com.android.application' }
android {
    namespace 'com.arco.stride'
    compileSdk 36
    defaultConfig {
        applicationId 'com.arco.stride'
        minSdk 29
        targetSdk 36
        versionCode 6
        versionName '3.3'
    }
    // Always the same key (see ~/Documents/stride-keys/README.txt): phones only accept updates signed
    // with the key they were installed with. If the file is missing the build stops instead of
    // quietly signing with a new key.
    signingConfigs {
        stride {
            storeFile file(System.getProperty('user.home') + '/Documents/stride-keys/stride.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.stride }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests { includeAndroidResources = true } }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation 'com.google.android.gms:play-services-fitness:21.2.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
